<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>makro</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="vendor/inter.css" />
    <link rel="stylesheet" href="vendor/kosik-ui-base.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/makro-fresh.css" />
    <link rel="stylesheet" href="css/chrome.css" />
    <link rel="stylesheet" href="css/store.css" />
    <link rel="stylesheet" href="css/filters.css" />
    <link rel="stylesheet" href="css/product.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/checkout.css" />
    <link rel="stylesheet" href="css/cart-b.css" />
    <link rel="stylesheet" href="selfcare/css/base.css" />
    <link rel="stylesheet" href="selfcare/css/components.css" />
    <link rel="stylesheet" href="selfcare/css/account.css" />
    <link rel="stylesheet" href="selfcare/css/shop.css" />
    <link rel="stylesheet" href="css/mk-account.css" />
    <script src="vendor/vue.global.js"></script>
    <script src="vendor/kosik-ui.js"></script>
    <script src="vendor/tailwind-play.js"></script>
    <script src="vendor/tailwind-setup.js"></script>
    <script src="js/makro-theme.js"></script>
  </head>
  <body>
    <div id="app">
      <a href="#" class="mk-skip" @click.prevent="focusMain">Přeskočit na obsah</a>
      <makro-header
        v-model="query"
        :cart-count="totals.lines"
        :cart-net="totals.net"
        :cart-gross="totals.gross"
        :cart-open="cartOpen"
        :simple="$route.path === '/kosik' && $route.query.variant === 'b'"
        @search="soon('Vyhledávání')"
        @address="openAddress"
        @notifications="soon('Oznámení')"
        @account-open="closeCart(false)"
        @cart-toggle="cartOpen = !cartOpen"
        @checkout="goCart"
        @shopping-lists="soon('Nákupní seznamy')"
        @repeat-order="soon('Zopakování objednávky')"
        @navigate="navigate">
        <template #cart><makro-cart-preview @close="closeCart(true)" @open-cart="goCart"></makro-cart-preview></template>
        <template #lists="{ close }"><makro-lists-pop @close="close(false)"></makro-lists-pop></template>
        <template #orders="{ close }"><makro-orders-pop @close="close(false)"></makro-orders-pop></template>
      </makro-header>
      <router-view></router-view>
      <makro-footer @link="soon('Odkaz v patičce')"></makro-footer>
      <makro-variant-switch v-if="variantItems($route).length" :items="variantItems($route)"></makro-variant-switch>
      <div v-if="store.toast" class="mk-toast" role="status">{{ store.toast }}</div>
    </div>

    <script src="js/fresh.js"></script>
    <script src="js/nav-data.js"></script>
    <script src="components/makro-chrome.js"></script>
    <script src="js/store.js"></script>
    <script src="js/makro-filters.js"></script>
    <script src="components/makro-product-box.js"></script>
    <script src="components/makro-cart-preview.js"></script>
    <script src="components/makro-nav-pops.js"></script>
    <script src="components/makro-filters-drawer.js"></script>
    <script src="components/makro-category-page.js"></script>
    <script src="components/makro-product-page.js"></script>
    <script src="components/makro-home-page.js"></script>
    <script src="components/makro-cart-page.js"></script>
    <script src="components/makro-cart-page-b.js"></script>
    <script src="components/makro-checkout-page.js"></script>
    <!-- account area copied from the fsd-selfcare prototype (see selfcare/bridge.js); order matters -->
    <script src="selfcare/i18n-stub.js"></script>
    <script src="selfcare/js/data.js"></script>
    <script src="selfcare/js/shop-data.js"></script>
    <script src="selfcare/js/ui.js"></script>
    <script src="selfcare/bridge.js"></script>
    <script src="selfcare/js/account.js"></script>
    <script src="selfcare/js/acctmenu.js"></script>
    <script src="selfcare/js/addrdrawer.js"></script>
    <script src="selfcare/js/pages/company.js"></script>
    <script src="selfcare/js/pages/orders.js"></script>
    <script src="selfcare/js/pages/authorized.js"></script>
    <script src="selfcare/js/pages/roles.js"></script>
    <script src="selfcare/js/pages/payments.js"></script>
    <script src="selfcare/js/pages/contracts.js"></script>
    <script src="selfcare/js/pages/personal.js"></script>
    <script src="selfcare/js/pages/security.js"></script>
    <script src="selfcare/js/pages/privacy.js"></script>
    <script src="selfcare/js/pages/terms.js"></script>
    <script src="selfcare/js/pages/users.js"></script>
    <script src="selfcare/js/pages/addresses.js"></script>
    <script src="components/makro-account-page.js"></script>
    <script>
      const { createRouter, createWebHashHistory } = KosikUI.vueRouter
      const M = window.Makro

      const app = Vue.createApp({
        setup() {
          const query = Vue.ref('')
          const totals = Vue.computed(() => M.totals())
          const cartOpen = Vue.ref(false)
          /* close the preview; give focus back to the header cart button when asked (Escape, close button) */
          const closeCart = (refocus) => {
            if (!cartOpen.value) return
            cartOpen.value = false
            if (refocus) Vue.nextTick(() => document.querySelector('.mk-cart-btn')?.focus())
          }
          const goCart = () => { closeCart(false); location.hash = '#/kosik' }
          /* delivery address drawer (Fresh Drawer from the selfcare account area) */
          const openAddress = () => { closeCart(false); window.AddrDrawer && window.AddrDrawer.open() }
          Vue.onMounted(() => {
            document.addEventListener('pointerdown', (e) => { if (cartOpen.value && !e.target.closest('.mk-cart')) closeCart(false) })
            window.addEventListener('hashchange', () => closeCart(false))
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCart(true) })
          })
          const focusMain = () => { const m = document.querySelector('main') || document.querySelector('.mk-account'); if (m) { m.setAttribute('tabindex', '-1'); m.focus() } }
          const navigate = (e) => { if (e.label === M.category.title) location.hash = M.categoryHash; else M.toast('Kategorie „' + e.label + '“ zatím není součástí prototypu.') }
          /* layout alternatives that can be compared with the corner switch */
          const variantItems = (r) => r.path === '/kosik'
            ? [{ label: 'Makro', href: '#/kosik', on: r.query.variant !== 'b' }, { label: 'Košík', href: '#/kosik?variant=b', on: r.query.variant === 'b' }]
            : r.path === '/' ? [{ label: 'Bez karet', href: '#/', on: r.query.variant !== 'cards' }, { label: 'S kartami', href: '#/?variant=cards', on: r.query.variant === 'cards' }] : []
          return { query, totals, cartOpen, closeCart, goCart, openAddress, focusMain, navigate, variantItems, store: M.store, soon: (what) => M.toast(what + ' zatím není součástí prototypu.') }
        },
      })
      app.component('MakroCartPreview', M.CartPreview)
      app.component('MakroVariantSwitch', M.VariantSwitch)
      app.component('MakroListsPop', M.ListsPop)
      app.component('MakroOrdersPop', M.OrdersPop)
      KosikUI.install(app)
      app.component('MakroHeader', ProtoKit.MakroHeader)
      app.component('MakroFooter', ProtoKit.MakroFooter)
      const router = createRouter({
          history: createWebHashHistory(),
          scrollBehavior: () => ({ top: 0 }),
          routes: [
            { path: '/produkt/:id', component: M.ProductPage, props: true },
            { path: '/kosik', component: M.CartRoute },
            { path: '/pokladna', component: M.CheckoutPage },
            { path: '/objednavka', component: M.OrderDonePage },
            { path: '/kategorie/:slug', component: M.CategoryPage },
            /* account area (selfcare island); renamed or merged pages keep working, as in selfcare */
            { path: '/ucet/newsletter', redirect: '/ucet/privacy' },
            { path: '/ucet/sites', redirect: '/ucet/addresses' },
            { path: '/ucet/:id?', component: M.AccountPage, props: true },
            /* "Nákupní seznamy" in the account menu points here (selfcare shop page, not part of the store prototype) */
            { path: '/seznamy', component: M.HomePage, beforeEnter: (to, from) => { M.toast('Nákupní seznamy zatím nejsou součástí prototypu.'); return from.matched.length ? false : '/' } },
            { path: '/:pathMatch(.*)*', component: M.HomePage },
          ],
      })
      /* page titles and focus: set the document title per route; after navigating inside the app move focus to the page */
      const titles = (to) => {
        if (to.path.startsWith('/produkt/')) return (M.byId(to.params.id) || {}).name || 'Produkt nenalezen'
        if (to.path === '/kosik') return to.query.variant === 'b' ? 'Košík (rozložení Košíku)' : 'Košík'
        if (to.path === '/pokladna') return 'Rekapitulace objednávky'
        if (to.path === '/objednavka') return 'Objednávka'
        if (to.path.startsWith('/kategorie/')) return M.category.title
        if (to.path.startsWith('/ucet')) return M.accountTitle(to.params.id)
        return 'Úvodní stránka'
      }
      router.afterEach((to, from, failure) => {
        if (failure) return // cancelled navigation (e.g. /seznamy): the page stays as it was
        document.title = titles(to) + ' | makro'
        if (from.matched.length) Vue.nextTick(() => { const m = document.querySelector('main') || document.querySelector('.mk-account'); if (m) { m.setAttribute('tabindex', '-1'); m.focus({ preventScroll: true }) } })
      })
      app.use(router)
      // Tailwind Play generates the DS classes asynchronously; mount once the first ones exist
      Fresh.ready.then(() => app.mount('#app'))
    </script>
  </body>
</html>
