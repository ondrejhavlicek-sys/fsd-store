    <circle cx="360" cy="214" r="9.5" fill="url(#b-gold)"/><circle cx="410" cy="222" r="10" fill="url(#b-red)"/><circle cx="458" cy="218" r="9.5" fill="url(#b-blue)"/><circle cx="500" cy="216" r="9" fill="url(#b-red)"/>
    <circle cx="338" cy="270" r="10" fill="url(#b-red)"/><circle cx="436" cy="278" r="11" fill="url(#b-gold)"/><circle cx="500" cy="274" r="10.5" fill="url(#b-blue)"/><circle cx="540" cy="284" r="9" fill="url(#b-gold)"/>
