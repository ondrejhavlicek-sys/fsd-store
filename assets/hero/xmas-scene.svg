  <path d="M0 320V296Q70 282 150 292T300 290T450 288T600 292T720 284V320Z" fill="url(#g-snow)"/>
  <path d="M0 304Q90 296 190 304T380 302T560 306T720 298V320H0Z" fill="#ffffff" opacity=".7"/>

  <!-- tree -->
  <g filter="url(#shadow)">
    <rect x="418" y="288" width="24" height="26" rx="2" fill="#5a3a22"/>
    <path d="M430 184C468 232 528 268 556 292Q495 306 430 298Q365 306 304 292C332 268 392 232 430 184Z" fill="url(#g-tree)"/>
    <path d="M430 128C462 170 510 214 538 248Q485 260 430 252Q375 260 322 248C350 214 398 170 430 128Z" fill="url(#g-tree)"/>
    <path d="M430 78C455 112 490 150 512 182Q470 192 430 186Q390 192 348 182C370 150 405 112 430 78Z" fill="url(#g-tree)"/>
    <path d="M430 44C448 70 470 96 486 120Q458 128 430 124Q402 128 374 120C390 96 412 70 430 44Z" fill="url(#g-tree)"/>
    <path d="M430 184C468 232 528 268 556 292Q495 306 430 298Q365 306 304 292C332 268 392 232 430 184Z" fill="url(#g-tree-lit)"/>
    <path d="M430 128C462 170 510 214 538 248Q485 260 430 252Q375 260 322 248C350 214 398 170 430 128Z" fill="url(#g-tree-lit)"/>
    <path d="M430 78C455 112 490 150 512 182Q470 192 430 186Q390 192 348 182C370 150 405 112 430 78Z" fill="url(#g-tree-lit)"/>
  </g>
  <!-- tree texture: soft needle strokes -->
  <g stroke="#0a3f2b" stroke-width="1.4" stroke-linecap="round" opacity=".35" fill="none">
    <path d="M392 110l8 6M410 100l6 8M452 102l-6 8M470 112l-8 6M372 168l10 6M396 150l8 8M464 150l-8 8M486 168l-10 6M346 236l12 6M376 214l10 8M484 214l-10 8M514 236l-12 6M330 276l14 8M372 262l12 8M488 262l-12 8M530 276l-14 8"/>
  </g>
  <g stroke="#6fe0a0" stroke-width="1.2" stroke-linecap="round" opacity=".28" fill="none">
    <path d="M414 96l-4 6M428 70l-3 6M404 150l-6 6M424 120l-4 7M388 214l-8 6M418 196l-5 7M400 254l-8 6M434 232l-5 7"/>
  </g>

  <!-- garlands with warm lights -->
  <g fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" opacity=".9">
    <path d="M384 108Q430 128 476 108"/><path d="M356 172Q430 196 504 172"/><path d="M332 236Q430 266 528 236"/><path d="M316 284Q430 312 544 284" opacity=".8"/>
