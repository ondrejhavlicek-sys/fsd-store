    <rect x="530" y="240" width="84" height="16" rx="3" fill="#0a3d91"/>
    <rect x="566" y="240" width="12" height="74" fill="#ffe500"/><rect x="530" y="244" width="84" height="7" fill="#ffe500"/>
    <ellipse cx="562" cy="232" rx="16" ry="9" transform="rotate(-22 562 232)" fill="#ffe500"/><ellipse cx="582" cy="232" rx="16" ry="9" transform="rotate(22 582 232)" fill="#ffe500"/><circle cx="572" cy="238" r="6" fill="#e0c400"/>
    <!-- cream box with red ribbon -->
    <rect x="392" y="286" width="48" height="28" rx="2.5" fill="url(#g-cream)"/>
    <rect x="388" y="281" width="56" height="9" rx="2.5" fill="#efe3c8"/>
    <rect x="412" y="281" width="9" height="33" fill="#d6283a"/>
    <ellipse cx="408" cy="276" rx="9" ry="5" transform="rotate(-20 408 276)" fill="#d6283a"/><ellipse cx="425" cy="276" rx="9" ry="5" transform="rotate(20 425 276)" fill="#d6283a"/>
    <!-- green box -->
    <rect x="620" y="278" width="52" height="36" rx="3" fill="url(#g-green)"/>
    <rect x="616" y="271" width="60" height="11" rx="3" fill="#0d5a3a"/>
    <rect x="642" y="271" width="9" height="43" fill="url(#g-gold)"/>
    <ellipse cx="638" cy="266" rx="10" ry="5.5" transform="rotate(-20 638 266)" fill="url(#g-gold)"/><ellipse cx="655" cy="266" rx="10" ry="5.5" transform="rotate(20 655 266)" fill="url(#g-gold)"/>
  </g>

  <!-- wine bottle and glass -->
  <g filter="url(#shadow)">
    <path d="M236 314V226Q236 206 245 196V152H257V196Q266 206 266 226V314Z" fill="url(#g-bottle)"/>
    <rect x="244" y="150" width="14" height="20" rx="2" fill="url(#g-gold)"/>
    <rect x="238" y="246" width="26" height="40" rx="2" fill="#f7f0de"/><rect x="238" y="246" width="26" height="6" fill="#d6283a"/><rect x="243" y="262" width="16" height="2.4" fill="#8a7a55"/><rect x="245" y="268" width="12" height="2.4" fill="#8a7a55"/>
    <rect x="240" y="212" width="3" height="96" rx="1.5" fill="#fff" opacity=".22"/>
    <path d="M284 262Q284 290 300 294Q316 290 316 262Z" fill="#ffffff" fill-opacity=".22" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.2"/>
    <path d="M285.5 274Q300 282 314.5 274L315 262H285Z" fill="#8f1228" opacity=".92"/>
    <rect x="298.8" y="294" width="2.4" height="16" fill="#ffffff" fill-opacity=".7"/><ellipse cx="300" cy="312" rx="11" ry="3" fill="#ffffff" fill-opacity=".6"/>
