    <line x1="630" y1="0" x2="630" y2="66" stroke="#e9d9a8" stroke-width="1.2"/><circle cx="630" cy="82" r="17" fill="url(#b-gold)"/><rect x="625" y="62" width="10" height="6" rx="1.5" fill="url(#g-gold)"/><ellipse cx="623" cy="75" rx="4.5" ry="7" fill="#fff" opacity=".5"/>
    <line x1="684" y1="0" x2="684" y2="30" stroke="#e9d9a8" stroke-width="1.2"/><circle cx="684" cy="42" r="12" fill="url(#b-blue)"/><rect x="679" y="26" width="10" height="6" rx="1.5" fill="url(#g-gold)"/><ellipse cx="679" cy="37" rx="3" ry="5" fill="#fff" opacity=".5"/>
  </g>

