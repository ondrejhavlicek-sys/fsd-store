<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Vánoční stromek s dárky, vínem a cukrovinkami">
  <defs>
    <linearGradient id="g-tree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3f2b"/><stop offset=".45" stop-color="#1f8f55"/><stop offset=".62" stop-color="#2aa466"/><stop offset="1" stop-color="#0b4a31"/>
    </linearGradient>
    <linearGradient id="g-tree-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="g-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0f7"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef3a4c"/><stop offset="1" stop-color="#a51526"/></linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a7bf0"/><stop offset="1" stop-color="#0a3d91"/></linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa36a"/><stop offset="1" stop-color="#0d5a3a"/></linearGradient>
    <linearGradient id="g-cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6d9bd"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#d49a12"/></linearGradient>
    <linearGradient id="g-bottle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06180f"/><stop offset=".35" stop-color="#1f5d3f"/><stop offset=".55" stop-color="#2d7a53"/><stop offset="1" stop-color="#06180f"/></linearGradient>
    <radialGradient id="b-red" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#ff9aa6"/><stop offset=".35" stop-color="#e5283c"/><stop offset="1" stop-color="#7d0f1c"/></radialGradient>
    <radialGradient id="b-gold" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#fffbd0"/><stop offset=".35" stop-color="#ffd23f"/><stop offset="1" stop-color="#a9740a"/></radialGradient>
    <radialGradient id="b-blue" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#bcdcff"/><stop offset=".35" stop-color="#3b8cf5"/><stop offset="1" stop-color="#0a2f73"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0" stop-opacity=".95"/><stop offset=".4" stop-color="#ffd23f" stop-opacity=".45"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#ffcf6b" stop-opacity=".5"/><stop offset=".55" stop-color="#ff9a4d" stop-opacity=".12"/><stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/></radialGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- warm halo behind the tree and out-of-focus lights (bokeh) -->
  <ellipse cx="430" cy="170" rx="260" ry="190" fill="url(#halo)"/>
  <g filter="url(#blur3)">
    <circle cx="330" cy="62" r="16" fill="#ffd23f" opacity=".28"/><circle cx="372" cy="30" r="10" fill="#ffffff" opacity=".3"/>
    <circle cx="520" cy="48" r="20" fill="#ff7a59" opacity=".24"/><circle cx="566" cy="96" r="12" fill="#ffd23f" opacity=".3"/>
    <circle cx="610" cy="40" r="14" fill="#ffffff" opacity=".26"/><circle cx="660" cy="118" r="22" fill="#ffd23f" opacity=".22"/>
    <circle cx="690" cy="60" r="9" fill="#ff7a59" opacity=".3"/><circle cx="318" cy="150" r="12" fill="#ffffff" opacity=".2"/>
    <circle cx="600" cy="176" r="10" fill="#ffffff" opacity=".28"/><circle cx="300" cy="104" r="8" fill="#ffd23f" opacity=".34"/>
    <circle cx="640" cy="220" r="16" fill="#ff7a59" opacity=".2"/><circle cx="270" cy="30" r="14" fill="#ffd23f" opacity=".2"/>
  </g>

  <!-- hanging baubles -->
  <g filter="url(#shadow)">
