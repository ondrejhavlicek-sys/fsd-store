      <circle cx="378" cy="180" r="7" fill="url(#glow)"/><circle cx="404" cy="188" r="7" fill="url(#glow)"/><circle cx="430" cy="191" r="7" fill="url(#glow)"/><circle cx="456" cy="188" r="7" fill="url(#glow)"/><circle cx="482" cy="180" r="7" fill="url(#glow)"/>
      <circle cx="356" cy="247" r="7" fill="url(#glow)"/><circle cx="392" cy="258" r="7" fill="url(#glow)"/><circle cx="430" cy="261" r="7" fill="url(#glow)"/><circle cx="468" cy="258" r="7" fill="url(#glow)"/><circle cx="504" cy="247" r="7" fill="url(#glow)"/>
      <circle cx="346" cy="297" r="7" fill="url(#glow)"/><circle cx="388" cy="305" r="7" fill="url(#glow)"/><circle cx="472" cy="305" r="7" fill="url(#glow)"/><circle cx="514" cy="297" r="7" fill="url(#glow)"/>
