  </g>

  <!-- star -->
  <circle cx="430" cy="40" r="34" fill="url(#glow)" filter="url(#blur3)"/>
  <path d="M430 20L436 34 451 35 439 45 443 60 430 52 417 60 421 45 409 35 424 34Z" fill="url(#g-gold)" stroke="#fff3b0" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- presents -->
  <g filter="url(#shadow)">
    <!-- red box -->
    <rect x="316" y="266" width="64" height="48" rx="3" fill="url(#g-red)"/>
    <rect x="312" y="258" width="72" height="14" rx="3" fill="#b01a2c"/>
    <rect x="342" y="258" width="12" height="56" fill="url(#g-gold)"/><rect x="312" y="262" width="72" height="6" fill="url(#g-gold)" opacity=".95"/>
