  <!-- candy canes -->
  <g fill="none" stroke-linecap="round">
    <path d="M160 314V248Q160 224 180 224Q200 224 200 246" stroke="#ffffff" stroke-width="11"/>
    <path d="M160 314V248Q160 224 180 224Q200 224 200 246" stroke="#d6283a" stroke-width="11" stroke-dasharray="9 11" stroke-linecap="butt"/>
    <path d="M120 316V270Q120 250 136 250Q152 250 152 268" stroke="#ffffff" stroke-width="9"/>
    <path d="M120 316V270Q120 250 136 250Q152 250 152 268" stroke="#d6283a" stroke-width="9" stroke-dasharray="8 10" stroke-linecap="butt"/>
  </g>

  <!-- gingerbread stars and sweets on the snow -->
  <g>
    <path d="M214 306l3.6-7.2 8 1-5.6-6 3-7.4-8 3.4-6.4-5.4 1 8.2-7 4.4 7.6 2.6z" fill="#b8742f" stroke="#8a5420" stroke-width=".8" transform="translate(4 -2)"/>
    <circle cx="214" cy="298" r="1.4" fill="#fff"/><circle cx="222" cy="300" r="1.1" fill="#fff"/>
    <path d="M668 308l2.8-5.6 6.2.8-4.4-4.6 2.4-5.8-6.2 2.6-5-4.2.8 6.4-5.4 3.4 5.9 2z" fill="#b8742f" stroke="#8a5420" stroke-width=".7"/>
    <circle cx="690" cy="304" r="5" fill="url(#b-red)"/><circle cx="702" cy="308" r="4" fill="url(#b-gold)"/>
    <path d="M580 316l12-9 12 9z" fill="#2fa36a" opacity=".0"/>
