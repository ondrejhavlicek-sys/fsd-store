    <circle cx="520" cy="86" r="2" opacity=".75"/><circle cx="548" cy="150" r="1.6" opacity=".7"/><circle cx="596" cy="130" r="2.2" opacity=".6"/><circle cx="650" cy="170" r="1.6" opacity=".8"/>
    <circle cx="700" cy="140" r="2" opacity=".7"/><circle cx="618" cy="210" r="1.8" opacity=".7"/><circle cx="270" cy="96" r="1.6" opacity=".7"/><circle cx="560" cy="200" r="1.4" opacity=".8"/>
    <circle cx="500" cy="40" r="1.5" opacity=".8"/><circle cx="352" cy="140" r="1.6" opacity=".7"/>
  </g>
</svg>
